server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # index.html y el bundle de Dart deben revalidarse siempre — si el
    # navegador los cachea viejos tras un rebuild, la app corre JS de una
    # build que ya no coincide con lo que hay en el server (se traba en el
    # splash o peor). Los assets con extensión (fuentes, imágenes) sí se
    # pueden cachear un rato, no cambian entre builds.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    location ~* \.(?:jpg|jpeg|png|gif|ico|svg|woff2?|ttf|otf)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }
}
