# ==========================================================
# SupplyNet - Configuración de Redis (cache de lecturas)
# ==========================================================
# Objetivo: acelerar lecturas frecuentes (catálogo de productos,
# categorías, búsqueda de proveedores cercanos) para no golpear
# Postgres en cada request.

bind 0.0.0.0
port 6379
protected-mode no

# Persistencia ligera (AOF) para no perder cache útil entre reinicios.
# No es crítico si se pierde: es cache, no fuente de verdad.
appendonly yes
appendfsync everysec

# Límite de memoria + política de expulsión tipo LRU: ideal para cache
# de lecturas, descarta lo menos usado cuando se llena.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Para producción real (fuera del hackathon): habilitar auth con
#   requirepass ${REDIS_PASSWORD}
# y quitar protected-mode no.
