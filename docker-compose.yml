name: supplynet

services:
  # ==========================================================
  # DB - PostgreSQL (entregado por Dev 1)
  # ==========================================================
  db:
    image: postgres:16-alpine
    container_name: supplynet_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supplynet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supplynet_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-supplynet}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Solo el script de verificación corre como init script de Postgres.
      - ./services/db/init:/docker-entrypoint-initdb.d:ro
      # El schema .sql vive fuera de docker-entrypoint-initdb.d para que
      # Postgres NO lo ejecute directo (lo aplica el script de verificación).
      - ./services/db/schema:/sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supplynet} -d ${POSTGRES_DB:-supplynet}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supplynet_net

  # ==========================================================
  # Redis - cache de lecturas (catálogo, categorías, búsquedas)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: supplynet_redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./services/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - supplynet_net

  # ==========================================================
  # Backend - PENDIENTE (descomentar cuando el dev entregue el código)
  # ==========================================================
  # backend:
  #   build:
  #     context: ./services/backend
  #   container_name: supplynet_backend
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgresql://${POSTGRES_USER:-supplynet}:${POSTGRES_PASSWORD:-supplynet_dev_password}@db:5432/${POSTGRES_DB:-supplynet}
  #     REDIS_URL: redis://redis:6379
  #     PORT: ${BACKEND_PORT:-3000}
  #   ports:
  #     - "${BACKEND_PORT:-3000}:3000"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - supplynet_net

  # ==========================================================
  # Frontend - PENDIENTE (descomentar cuando el dev entregue el código)
  # ==========================================================
  # frontend:
  #   build:
  #     context: ./services/frontend
  #   container_name: supplynet_frontend
  #   restart: unless-stopped
  #   environment:
  #     VITE_API_URL: http://localhost:${BACKEND_PORT:-3000}
  #   ports:
  #     - "${FRONTEND_PORT:-5173}:5173"
  #   depends_on:
  #     - backend
  #   networks:
  #     - supplynet_net

volumes:
  db_data:
  redis_data:

networks:
  supplynet_net:
    driver: bridge
